<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KROXY SCRIPTS | Steal An Egg</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #05030a;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 40px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(147, 51, 234, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(192, 38, 211, 0.15) 0%, transparent 40%);
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 5, 20, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.2);
            gap: 16px;
        }

        /* Soldan Sağa Dalğalanan Logo Text */
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #38bdf8, #ffffff, #38bdf8, #ffffff);
            background-size: 200% auto;
            color: #fff;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: waveGradient 3s linear infinite;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
            white-space: nowrap;
        }

        @keyframes waveGradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(20, 10, 35, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a855f7;
            font-size: 0.9rem;
        }

        /* Main Container & Header */
        .container {
            width: 100%;
            max-width: 1280px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-left: 4px solid #c084fc;
            padding-left: 12px;
        }

        .panel-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            color: #f3e8ff;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
        }

        .panel-header span {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid #a855f7;
            color: #c084fc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Responsiv Grid Sxemi */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
            gap: 20px;
        }

        /* Script Kartı */
        .script-card {
            background: rgba(15, 8, 30, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            box-sizing: border-box;
        }

        .script-card:hover {
            transform: translateY(-5px);
            border-color: #c084fc;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.35);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .script-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .script-title i {
            color: #a855f7;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        /* Kopyala Düyməsi */
        .btn-copy {
            background: linear-gradient(135deg, #7e22ce 0%, #a855f7 100%);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
            flex-shrink: 0;
            min-height: 36px;
        }

        .btn-copy:active {
            transform: scale(0.95);
        }

        @media (hover: hover) {
            .btn-copy:hover {
                background: linear-gradient(135deg, #9333ea 0%, #c084fc 100%);
                box-shadow: 0 0 15px rgba(192, 132, 252, 0.6);
                transform: scale(1.03);
            }
        }

        .btn-copy.copied {
            background: #22c55e !important;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.5) !important;
        }

        /* Code Block */
        .code-block {
            background: #080412;
            border: 1px solid rgba(168, 85, 247, 0.15);
            padding: 10px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            color: #d8b4fe;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #a855f7 #080412;
            width: 100%;
        }

        .code-block::-webkit-scrollbar {
            height: 4px;
        }
        .code-block::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 4px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .status-badge {
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        /* Mobil Cihaz Xüsusi Uyğunlaşması */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 14px 16px;
            }

            .logo-text {
                text-align: center;
            }

            .search-box {
                max-width: 100%;
            }

            .container {
                padding: 0 12px;
                margin: 16px auto;
            }

            .script-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .script-card {
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="navbar">
        <div class="logo-text">KROXY SCRIPTS</div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Script axtar..." onkeyup="filterScripts()">
        </div>
    </div>

    <!-- Main Content Panel -->
    <div class="container">
        <div class="panel-header">
            <h1>Steal An Egg</h1>
            <span id="scriptCount">10 Scripts</span>
        </div>

        <div class="script-grid" id="scriptGrid">
            <!-- Script Kartları JavaScript ilə Yüklənir -->
        </div>
    </div>

    <script>
        const scriptsData = [
            { name: "Chilli Hub", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/tienkhanh1/spicy/main/Chilli.lua"))()' },
            { name: "Tsuo Hub", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/Tsuo7/TsuoHub/main/stealanegg"))()' },
            { name: "Axon Hub", code: 'loadstring(game:HttpGet("https://api.luarmor.net/files/v3/loaders/97c3f6db55a2cf72141537a85458e5a7.lua"))()' },
            { name: "Foxname Hub", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/caomod2077/Script/refs/heads/main/Fn-stealanegg.lua"))()' },
            { name: "Rift Hub", code: 'loadstring(game:HttpGet("https://rifton.top/loader.lua"))()' },
            { name: "OMG Hub", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/Omgshit/Scripts/main/MainLoader.lua"))()' },
            { name: "Clover Hub", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/Ryuun0x/Clover/main/main.lua"))()' },
            { name: "Ajjans Hub", code: 'loadstring(game:HttpGet("https://api.luarmor.net/files/v4/loaders/359e97f8618e9008afe5f496184ebb7c.lua"))()' },
            { name: "Solix Hub", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/porqueijjmzm1/cool/main/StealAEgg"))()' },
            { name: "Pig Hub", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/mopsscript7-gif/steal-an-egg/refs/heads/main/script.lua"))()' }
        ];

        const grid = document.getElementById('scriptGrid');

        function renderScripts(data) {
            grid.innerHTML = '';
            document.getElementById('scriptCount').innerText = `${data.length} Scripts`;

            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'script-card';
                card.innerHTML = `
                    <div class="card-top">
                        <div class="script-title">
                            <i class="fa-solid fa-code"></i> ${item.name}
                        </div>
                        <button class="btn-copy" onclick="copyScript('${encodeURIComponent(item.code)}', this)">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                    </div>
                    <div class="code-block">${item.code}</div>
                    <div class="card-footer">
                        <span class="status-badge"><i class="fa-solid fa-circle-check"></i> Undetected</span>
                        <span>Steal An Egg</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function copyScript(encodedCode, btn) {
            const code = decodeURIComponent(encodedCode);
            
            // Mobil və Desktop uyğun kopyalama
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(code).then(() => setCopiedUI(btn));
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = code;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopiedUI(btn);
                } catch (err) {
                    console.error('Kopyalama xətası:', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function setCopiedUI(btn) {
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
            btn.classList.add('copied');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('copied');
            }, 2000);
        }

        function filterScripts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = scriptsData.filter(s => s.name.toLowerCase().includes(query));
            renderScripts(filtered);
        }

        // İlkin yüklənmə
        renderScripts(scriptsData);
    </script>
</body>
</html>
