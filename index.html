<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KROXY SCRIPTS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        :root {
            --bg-dark: #040208;
            --card-bg: rgba(16, 9, 32, 0.85);
            --primary-neon: #a855f7;
            --secondary-neon: #06b6d4;
            --success-green: #22c55e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(168, 85, 247, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body.hide-scrollbar {
            overflow: hidden !important;
        }

        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(4, 2, 8, 0.8);
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-neon), var(--secondary-neon));
            border-radius: 20px;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            padding-top: env(safe-area-inset-top);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Intro Screen */
        #introScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020105;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-out, visibility 0.6s;
        }

        .intro-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.1rem, 4.5vw, 2rem);
            font-weight: 900;
            text-align: center;
            padding: 0 16px;
            background: linear-gradient(90deg, #fff, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0.9);
            animation: introFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        @keyframes introFadeIn {
            to { opacity: 1; transform: scale(1); }
        }

        #introScreen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(10px + env(safe-area-inset-top)) 14px 10px 14px;
            background: rgba(8, 3, 18, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            background: linear-gradient(90deg, #fff, var(--primary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            background: rgba(12, 6, 26, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-neon);
            font-size: 0.9rem;
        }

        .tabs-header {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: rgba(10, 5, 22, 0.6);
            padding: 4px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 9px 10px;
            background: transparent;
            border: none;
            border-radius: 20px;
            color: var(--text-sub);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            box-shadow: 0 2px 12px rgba(168, 85, 247, 0.5);
        }

        .section-header-box {
            text-align: center;
            margin: 10px 0 12px 0;
            padding: 8px 12px;
            background: rgba(16, 9, 32, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 15px;
            backdrop-filter: blur(8px);
        }

        .section-header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(90deg, #fff, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-header-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 3px;
        }

        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
            gap: 10px;
        }

        .script-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(20px);
            animation: cardFadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .script-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
            border-color: var(--primary-neon);
        }

        @keyframes cardFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .script-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-title i {
            color: var(--secondary-neon);
            font-size: 0.85rem;
        }

        .code-box {
            background: rgba(4, 2, 10, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .code-text {
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: #d8b4fe;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.35;
        }

        .btn-copy {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            border: none;
            padding: 9px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 12px rgba(168, 85, 247, 0.3);
            transition: all 0.25s ease;
        }

        .btn-copy:hover {
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.6);
            transform: scale(1.02);
        }

        .btn-copy.copied {
            background: linear-gradient(135deg, #16a34a, var(--success-green)) !important;
        }

        /* KROXY AI INTERFACE */
        .ai-wrapper {
            display: none;
            flex-direction: column;
            height: clamp(420px, 68vh, 600px);
            max-height: calc(100dvh - 170px);
            background: rgba(14, 8, 28, 0.85);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
            user-select: text;
            animation: fadeInAI 0.4s ease-in-out;
            position: relative;
        }

        @keyframes fadeInAI {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-chat-box {
            flex: 1;
            padding: 12px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(4, 2, 10, 0.5);
            scroll-behavior: smooth;
        }

        .ai-msg {
            max-width: 88%;
            width: fit-content;
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 0.83rem;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            opacity: 0;
            animation: messageSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ai-msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
        }

        .ai-msg-bot {
            align-self: flex-start;
            background: rgba(22, 12, 42, 0.92);
            border: 1px solid var(--border-glow);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
        }

        .ai-msg-thinking {
            padding: 8px 14px !important;
            width: auto !important;
            min-width: unset !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 14px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--secondary-neon);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--secondary-neon);
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; box-shadow: 0 0 10px var(--primary-neon); }
        }

        .ai-file-bar {
            display: none;
            padding: 8px 14px;
            background: rgba(8, 4, 18, 0.95);
            border-top: 1px solid var(--border-glow);
            font-size: 0.78rem;
            color: var(--secondary-neon);
            justify-content: space-between;
            align-items: center;
            animation: messageSlide 0.25s ease-out;
        }

        .ai-file-bar button {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }

        /* SANCAQ MENYUSU */
        .attach-menu {
            position: absolute;
            bottom: 60px;
            left: 14px;
            background: rgba(14, 8, 28, 0.98);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            z-index: 50;
            transform-origin: bottom left;
        }

        .attach-menu.opening {
            display: flex !important;
            animation: menuFadeInUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .attach-menu.closing {
            display: flex !important;
            animation: menuFadeOutDown 0.18s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes menuFadeInUp {
            from { opacity: 0; transform: translateY(12px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes menuFadeOutDown {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(12px) scale(0.9); }
        }

        .attach-menu-btn {
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 9px 13px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            text-align: left;
        }

        .attach-menu-btn:active { transform: scale(0.95); }
        .attach-menu-btn:hover { background: rgba(168, 85, 247, 0.2); color: var(--secondary-neon); }

        .ai-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: rgba(8, 4, 18, 0.95);
            border-top: 1px solid var(--border-glow);
            position: relative;
        }

        .ai-attach-btn {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid var(--border-glow);
            color: var(--primary-neon);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
            flex-shrink: 0;
        }

        .ai-attach-btn:active { transform: scale(0.88); }
        .ai-attach-btn:hover {
            background: var(--primary-neon);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        .ai-input-area textarea {
            flex: 1;
            background: rgba(4, 2, 10, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 22px;
            padding: 10px 16px;
            color: #fff;
            outline: none;
            resize: none;
            height: 40px;
            max-height: 90px;
            font-size: 0.83rem;
            user-select: text;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }

        .ai-input-area textarea::placeholder { color: #64748b; font-weight: 500; }
        .ai-input-area textarea:focus { border-color: var(--primary-neon); box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }

        .ai-send-btn {
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            border: 1px solid var(--border-glow);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, background 0.25s;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            flex-shrink: 0;
        }

        .ai-send-btn:active { transform: scale(0.85) rotate(-15deg); }
        .ai-send-btn:hover {
            transform: scale(1.08) rotate(-8deg);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
            background: linear-gradient(135deg, #c084fc, var(--primary-neon));
        }

        .ai-gen-img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        @media (max-width: 768px) {
            .container { padding: 6px; }
            .script-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
            .ai-wrapper { height: calc(100dvh - 190px); border-radius: 16px; }
            .ai-msg { max-width: 92%; }
        }
    </style>
</head>
<body class="hide-scrollbar">

    <div id="introScreen">
        <div class="intro-title">KROXY SCRIPTS-Ə XOŞ GƏLMİSİNİZ!</div>
    </div>

    <div class="navbar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-code"></i></div>
            <div class="logo-text">KROXY SCRIPTS</div>
        </div>
    </div>

    <div class="container">
        
        <div class="search-box" id="searchContainer">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Skript adı ilə axtar..." onkeyup="filterScripts()">
        </div>

        <div class="tabs-header">
            <button class="tab-btn active" id="tabSteal" onclick="switchTab('steal')">
                <i class="fa-solid fa-egg"></i> Steal An Egg
            </button>
            <button class="tab-btn" id="tabKroxyAI" onclick="switchTab('kroxyai')">
                <i class="fa-solid fa-brain"></i> KROXY AI
            </button>
        </div>

        <div class="section-header-box">
            <div class="section-header-title" id="headerTitle">Steal An Egg Scriptlərimiz!</div>
            <div class="section-header-sub" id="headerSub">Bütün executorlar üçün yararlıdır scriptlərimiz!</div>
        </div>

        <div class="script-grid" id="scriptGrid"></div>

        <div class="ai-wrapper" id="aiWrapper">
            <div class="ai-chat-box" id="aiChatBox">
                <div class="ai-msg ai-msg-bot">KROXY AI həmişə köməyinizdədir! Buyurun nə isdiyirdiniz?</div>
            </div>

            <div class="ai-file-bar" id="aiFileBar">
                <span id="aiFileName">📁 fayl.txt</span>
                <button onclick="removeAiFile()"><i class="fa-solid fa-xmark"></i> Ləğv et</button>
            </div>

            <div class="attach-menu" id="attachMenu">
                <button class="attach-menu-btn" onclick="triggerInput('image')">
                    <i class="fa-solid fa-image" style="color: #06b6d4;"></i> Şəkil Göndər
                </button>
                <button class="attach-menu-btn" onclick="triggerInput('file')">
                    <i class="fa-solid fa-file-code" style="color: #a855f7;"></i> Faylı Göndər
                </button>
            </div>

            <div class="ai-input-area">
                <div class="ai-attach-btn" onclick="toggleAttachMenu(event)" title="Əlavə et">
                    <i class="fa-solid fa-paperclip"></i>
                </div>

                <input type="file" id="aiImageUpload" accept="image/*" style="display: none;" onchange="handleAiFileUpload(event, 'image')">
                <input type="file" id="aiFileUpload" accept=".txt,.lua,.js,.html,.css,.json,.cpp,.py" style="display: none;" onchange="handleAiFileUpload(event, 'file')">

                <textarea id="aiInput" placeholder="Kodu və ya promptu bura yazın..." rows="1" onkeydown="handleAiKeyDown(event)"></textarea>

                <button class="ai-send-btn" id="aiSendBtn" onclick="sendAiMessage()" title="Göndər">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const intro = document.getElementById('introScreen');
                if(intro) {
                    intro.classList.add('fade-out');
                    document.body.classList.remove('hide-scrollbar');
                }
            }, 1600);
        });

        const stealScripts = [
            { name: "Chilli Hub", code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/tienkhanh1/spicy/main/Chilli.lua"))()` },
            { name: "Tsuo Hub", code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/Tsuo7/TsuoHub/main/stealanegg"))()` },
            { name: "Axon Hub", code: `loadstring(game:HttpGet("https://api.luarmor.net/files/v3/loaders/97c3f6db55a2cf72141537a85458e5a7.lua"))()` },
            { name: "Foxname Hub", code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/caomod2077/Script/refs/heads/main/Fn-stealanegg.lua"))()` },
            { name: "Rift Hub", code: `loadstring(game:HttpGet("https://rifton.top/loader.lua"))()` },
            { name: "OMG Hub", code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/Omgshit/Scripts/main/MainLoader.lua"))()` },
            { name: "Clover Hub", code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/Ryuun0x/Clover/main/main.lua"))()` },
            { name: "Ajjans Hub", code: `loadstring(game:HttpGet("https://api.luarmor.net/files/v4/loaders/359e97f8618e9008afe5f496184ebb7c.lua"))()` },
            { name: "Solix Hub", code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/porqueijjmzm1/cool/main/StealAEgg"))()` },
            { name: "Pig Hub", code: `loadstring(game:HttpGet("https://raw.githubusercontent.com/mopsscript7-gif/steal-an-egg/refs/heads/main/script.lua"))()` }
        ];

        let activeTab = 'steal';
        const grid = document.getElementById('scriptGrid');
        const aiWrapper = document.getElementById('aiWrapper');
        const searchContainer = document.getElementById('searchContainer');

        function renderScripts(data) {
            grid.innerHTML = '';
            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'script-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.innerHTML = `
                    <div class="card-top">
                        <div class="script-title">
                            <i class="fa-solid fa-terminal"></i> ${item.name}
                        </div>
                    </div>
                    <div class="code-box">
                        <div class="code-text">${item.code}</div>
                    </div>
                    <button class="btn-copy" onclick="copyScript(this)">
                        Skripti Kopyala <i class="fa-regular fa-copy"></i>
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function copyScript(btn) {
            const card = btn.closest('.script-card');
            const codeText = card.querySelector('.code-text').innerText.trim();

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(codeText)
                    .then(() => setCopiedState(btn))
                    .catch(() => universalCopy(codeText, btn));
            } else {
                universalCopy(codeText, btn);
            }
        }

        function universalCopy(text, btn) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                setCopiedState(btn);
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function setCopiedState(btn) {
            btn.innerHTML = `Kopyalandı <i class="fa-solid fa-check"></i>`;
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerHTML = `Skripti Kopyala <i class="fa-regular fa-copy"></i>`;
                btn.classList.remove('copied');
            }, 3000);
        }

        function switchTab(tabName) {
            if(activeTab === tabName) return;

            activeTab = tabName;
            document.getElementById('tabSteal').classList.toggle('active', tabName === 'steal');
            document.getElementById('tabKroxyAI').classList.toggle('active', tabName === 'kroxyai');

            const titleEl = document.getElementById('headerTitle');
            const subEl = document.getElementById('headerSub');

            if(tabName === 'steal') {
                titleEl.innerText = "Steal An Egg Scriptlərimiz!";
                subEl.innerText = "Bütün executorlar üçün yararlıdır scriptlərimiz!";
                subEl.style.display = 'block';
                searchContainer.style.display = 'block';
                aiWrapper.style.display = 'none';
                grid.style.display = 'grid';
                renderScripts(stealScripts);
            } else {
                titleEl.innerText = "KROXY AI Köməkçi Bot!";
                subEl.innerText = "";
                subEl.style.display = 'none';
                searchContainer.style.display = 'none';
                grid.style.display = 'none';
                aiWrapper.style.display = 'flex';
            }
        }

        function filterScripts() {
            if(activeTab !== 'steal') return;
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = stealScripts.filter(s => s.name.toLowerCase().includes(query));
            renderScripts(filtered);
        }

        /* SANCAQ MENYUSUNUN İDARƏ EDİLMƏSİ */
        let isMenuOpen = false;

        function toggleAttachMenu(e) {
            e.stopPropagation();
            if (isMenuOpen) {
                closeAttachMenu();
            } else {
                openAttachMenu();
            }
        }

        function openAttachMenu() {
            const menu = document.getElementById('attachMenu');
            menu.classList.remove('closing');
            menu.classList.add('opening');
            isMenuOpen = true;
        }

        function closeAttachMenu() {
            const menu = document.getElementById('attachMenu');
            if (!isMenuOpen) return;
            menu.classList.remove('opening');
            menu.classList.add('closing');
            setTimeout(() => {
                menu.classList.remove('closing');
                menu.style.display = 'none';
                isMenuOpen = false;
            }, 180);
        }

        document.addEventListener('click', (e) => {
            if (isMenuOpen) closeAttachMenu();
        });

        let attachedAiFile = null;

        function triggerInput(type) {
            closeAttachMenu();
            if (type === 'image') {
                document.getElementById('aiImageUpload').click();
            } else {
                document.getElementById('aiFileUpload').click();
            }
        }

        function handleAiFileUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            if (type === 'image') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedAiFile = { name: file.name, type: 'image', content: e.target.result };
                    document.getElementById('aiFileName').textContent = `🖼️ ${file.name}`;
                    document.getElementById('aiFileBar').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedAiFile = { name: file.name, type: 'file', content: e.target.result };
                    document.getElementById('aiFileName').textContent = `📄 ${file.name}`;
                    document.getElementById('aiFileBar').style.display = 'flex';
                };
                reader.readAsText(file);
            }
        }

        function removeAiFile() {
            attachedAiFile = null;
            document.getElementById('aiFileUpload').value = '';
            document.getElementById('aiImageUpload').value = '';
            document.getElementById('aiFileBar').style.display = 'none';
        }

        /* YÜKSƏK MƏNTİQ VƏ KODLAMA QABİLİYYƏTLİ AI ENGINE */
        async function generateRealAiResponse(promptText, attachment) {
            if (promptText.toLowerCase().startsWith("/imagine") || promptText.toLowerCase().includes("şəkil yarat")) {
                let cleanPrompt = promptText.replace(/şəkil yarat/gi, "").replace(/\/imagine/gi, "").trim();
                if (!cleanPrompt) cleanPrompt = "cyberpunk neon robot";
                const img = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt)}?width=800&height=500&nologo=true`;
                return `🎨 <b>Yaradılan Şəkil: "${cleanPrompt}"</b><br><img class="ai-gen-img" src="${img}">`;
            }

            let fullPrompt = promptText;
            if (attachment) {
                if (attachment.type === 'file') {
                    fullPrompt += `\n\n[Fayl Məzmunu - ${attachment.name}]:\n${attachment.content}`;
                } else if (attachment.type === 'image') {
                    fullPrompt += `\n\n[İstifadəçi Şəkil Əlavə Etdi: ${attachment.name}]`;
                }
            }

            const sys = "Sən KROXY AI-san. Kodlama (Luau, Roblox Studio, JS, Python) və alqoritmik düşüncə bacarığın maksimumdur. Suala birbaşa, dəqiq və tam optimallaşdırılmış kod həlli ver.";

            try {
                const controller = new AbortController();
                const response = await fetch("https://text.pollinations.ai/openai", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: sys },
                            { role: "user", content: fullPrompt }
                        ],
                        model: "qwen-coder",
                        temperature: 0.2
                    })
                });

                if (response.ok) {
                    const text = await response.text();
                    if(text && !text.includes("ENOSPC")) return text;
                }

                // Fallback
                const resFallback = await fetch(`https://text.pollinations.ai/${encodeURIComponent(sys + "\n" + fullPrompt)}`);
                if(resFallback.ok) {
                    return await resFallback.text();
                }
            } catch (error) {
                return "⚠️ Xəta baş verdi, bir daha cəhd edin.";
            }

            return "⚠️ Xəta baş verdi.";
        }

        function handleAiKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendAiMessage();
            }
        }

        async function sendAiMessage() {
            const inputEl = document.getElementById('aiInput');
            const query = inputEl.value.trim();

            if (!query && !attachedAiFile) return;

            const chatBox = document.getElementById('aiChatBox');

            const userDiv = document.createElement('div');
            userDiv.className = 'ai-msg ai-msg-user';
            
            let displayMsg = query;
            if (attachedAiFile) {
                displayMsg += `\n[${attachedAiFile.type === 'image' ? '🖼️ Şəkil' : '📄 Fayl'}: ${attachedAiFile.name}]`;
            }
            userDiv.textContent = displayMsg;
            chatBox.appendChild(userDiv);

            inputEl.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const botDiv = document.createElement('div');
            botDiv.className = 'ai-msg ai-msg-bot ai-msg-thinking';
            botDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            const currentAttachment = attachedAiFile;
            removeAiFile();

            const response = await generateRealAiResponse(query, currentAttachment);
            botDiv.classList.remove('ai-msg-thinking');
            botDiv.textContent = response;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        renderScripts(stealScripts);
    </script>
</body>
</html>
