<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KROXY SCRIPTS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        :root {
            --bg-dark: #040208;
            --card-bg: rgba(16, 9, 32, 0.85);
            --primary-neon: #a855f7;
            --secondary-neon: #06b6d4;
            --success-green: #22c55e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(168, 85, 247, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body.hide-scrollbar {
            overflow: hidden !important;
        }

        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(4, 2, 8, 0.8);
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-neon), var(--secondary-neon));
            border-radius: 20px;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            padding-top: env(safe-area-inset-top);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Intro Screen */
        #introScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020105;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-out, visibility 0.6s;
        }

        .intro-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.1rem, 4.5vw, 2rem);
            font-weight: 900;
            text-align: center;
            padding: 0 16px;
            background: linear-gradient(90deg, #fff, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0.9);
            animation: introFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        @keyframes introFadeIn {
            to { opacity: 1; transform: scale(1); }
        }

        #introScreen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(10px + env(safe-area-inset-top)) 14px 10px 14px;
            background: rgba(8, 3, 18, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            background: linear-gradient(90deg, #fff, var(--primary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            background: rgba(12, 6, 26, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-neon);
            font-size: 0.9rem;
        }

        .tabs-header {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: rgba(10, 5, 22, 0.6);
            padding: 4px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 9px 10px;
            background: transparent;
            border: none;
            border-radius: 20px;
            color: var(--text-sub);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            box-shadow: 0 2px 12px rgba(168, 85, 247, 0.5);
        }

        .section-header-box {
            text-align: center;
            margin: 10px 0 12px 0;
            padding: 8px 12px;
            background: rgba(16, 9, 32, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 15px;
            backdrop-filter: blur(8px);
        }

        .section-header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(90deg, #fff, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-header-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 3px;
        }

        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
            gap: 10px;
        }

        .script-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(20px);
            animation: cardFadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .script-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
            border-color: var(--primary-neon);
        }

        @keyframes cardFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .script-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-title i {
            color: var(--secondary-neon);
            font-size: 0.85rem;
        }

        .code-box {
            background: rgba(4, 2, 10, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .code-text {
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: #d8b4fe;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.35;
        }

        .btn-copy {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            border: none;
            padding: 9px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 12px rgba(168, 85, 247, 0.3);
            transition: all 0.25s ease;
        }

        .btn-copy:hover {
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.6);
            transform: scale(1.02);
        }

        .btn-copy.copied {
            background: linear-gradient(135deg, #16a34a, var(--success-green)) !important;
        }

        /* KROXY AI INTERFACE */
        .ai-wrapper {
            display: none;
            flex-direction: column;
            height: clamp(420px, 68vh, 600px);
            max-height: calc(100dvh - 170px);
            background: rgba(14, 8, 28, 0.85);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
            user-select: text;
            animation: fadeInAI 0.4s ease-in-out;
            position: relative;
        }

        @keyframes fadeInAI {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-chat-box {
            flex: 1;
            padding: 12px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(4, 2, 10, 0.5);
            scroll-behavior: smooth;
        }

        .ai-msg {
            max-width: 88%;
            width: fit-content;
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 0.83rem;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            opacity: 0;
            animation: messageSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .ai-msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
        }

        .ai-msg-bot {
            align-self: flex-start;
            background: rgba(22, 12, 42, 0.92);
            border: 1px solid var(--border-glow);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
        }

        .ai-msg-thinking {
            padding: 8px 14px !important;
            width: auto !important;
            min-width: unset !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 14px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--secondary-neon);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--secondary-neon);
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; box-shadow: 0 0 10px var(--primary-neon); }
        }

        .ai-file-bar {
            display: none;
            padding: 8px 14px;
            background: rgba(8, 4, 18, 0.95);
            border-top: 1px solid var(--border-glow);
            font-size: 0.78rem;
            color: var(--secondary-neon);
            justify-content: space-between;
            align-items: center;
            animation: messageSlide 0.25s ease-out;
        }

        .ai-file-bar button {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
        }

        /* SANCAQ MENYUSU */
        .attach-menu {
            position: absolute;
            bottom: 60px;
            left: 14px;
            background: rgba(14, 8, 28, 0.98);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            z-index: 50;
            transform-origin: bottom left;
        }

        .attach-menu.opening {
            display: flex !important;
            animation: menuFadeInUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .attach-menu.closing {
            display: flex !important;
            animation: menuFadeOutDown 0.18s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes menuFadeInUp {
            from { opacity: 0; transform: translateY(12px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes menuFadeOutDown {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(12px) scale(0.9); }
        }

        .attach-menu-btn {
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 9px 13px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            text-align: left;
        }

        .attach-menu-btn:active { transform: scale(0.95); }
        .attach-menu-btn:hover { background: rgba(168, 85, 247, 0.2); color: var(--secondary-neon); }

        .ai-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: rgba(8, 4, 18, 0.95);
            border-top: 1px solid var(--border-glow);
            position: relative;
        }

        .ai-attach-btn {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid var(--border-glow);
            color: var(--primary-neon);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
            flex-shrink: 0;
        }

        .ai-attach-btn:active { transform: scale(0.88); }
        .ai-attach-btn:hover {
            background: var(--primary-neon);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        .ai-input-area textarea {
            flex: 1;
            background: rgba(4, 2, 10, 0.95);
            border: 1px solid var(--border-glow);
            border-radius: 22px;
            padding: 10px 16px;
            color: #fff;
            outline: none;
            resize: none;
            height: 40px;
            max-height: 90px;
            font-size: 0.83rem;
            user-select: text;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }

        .ai-input-area textarea::placeholder { color: #64748b; font-weight: 500; }
        .ai-input-area textarea:focus { border-color: var(--primary-neon); box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }

        .ai-send-btn {
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            border: 1px solid var(--border-glow);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, background 0.25s;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
            flex-shrink: 0;
        }

        .ai-send-btn:active { transform: scale(0.85) rotate(-15deg); }
        .ai-send-btn:hover {
            transform: scale(1.08) rotate(-8deg);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.8);
            background: linear-gradient(135deg, #c084fc, var(--primary-neon));
        }

        .ai-gen-img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        @media (max-width: 768px) {
            .container { padding: 6px; }
            .script-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
            .ai-wrapper { height: calc(100dvh - 190px); border-radius: 16px; }
            .ai-msg { max-width: 92%; }
        }
    
        .ai-msg-bot pre.ai-code { background:#0b1020; border:1px solid rgba(168,85,247,0.3); border-radius:10px; padding:10px 12px; margin:8px 0; overflow-x:auto; font-size:12.5px; line-height:1.5; text-align:left; }
        .ai-msg-bot pre.ai-code code { font-family:Consolas,Menlo,monospace; color:#c4b5fd; white-space:pre; }
        .ai-msg-bot code.ai-inline { background:rgba(168,85,247,0.2); padding:1px 6px; border-radius:6px; font-family:Consolas,Menlo,monospace; font-size:12.5px; }

        .k-ico { width: 1em; height: 1em; vertical-align: -0.14em; display: inline-block; }
        .brand-icon .k-ico { width: 20px; height: 20px; vertical-align: 0; }
        .script-title .k-ico { width: 1.15em; height: 1.15em; color: var(--secondary-neon); margin-right: 2px; }

        i.k-i { font-style: normal; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
        .search-box i.k-i { pointer-events: none; }
        .ai-attach-btn .k-ico, .ai-send-btn .k-ico { width: 1.15rem; height: 1.15rem; }
        .attach-menu-btn .k-ico { width: 1.15rem; height: 1.15rem; }
</style>
</head>
<body class="hide-scrollbar">

    <div id="introScreen">
        <div class="intro-title">KROXY SCRIPTS-Ə XOŞ GƏLMİSİNİZ!</div>
    </div>

    <div class="navbar">
        <div class="brand">
            <div class="brand-icon"><svg class="k-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><polyline points="6.5,9 10.5,12 6.5,15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12.5" y1="15.5" x2="17.5" y2="15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
            <div class="logo-text">KROXY SCRIPTS</div>
        </div>
    </div>

    <div class="container">
        
        <div class="search-box" id="searchContainer">
            <i class="k-i"><svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg></i>
            <input type="text" id="searchInput" placeholder="Skript adı ilə axtar..." onkeyup="filterScripts()">
        </div>

        <div class="tabs-header">
            <button class="tab-btn active" id="tabSteal" onclick="switchTab('steal')">
                <svg class="k-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C8 2 4.5 9 4.5 14a7.5 7.5 0 0 0 15 0C19.5 9 16 2 12 2z"/></svg> Steal An Egg
            </button>
            <button class="tab-btn" id="tabKroxyAI" onclick="switchTab('kroxyai')">
                <i class="k-i"><svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 4.5A3 3 0 0 0 9 20h.5a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 9.5 4z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 4.5A3 3 0 0 1 15 20h-.5a1.5 1.5 0 0 1-1.5-1.5v-13A1.5 1.5 0 0 1 14.5 4z"/><path d="M6 10.5h2.2M15.8 10.5H18M6.5 15h2M15.5 15h2"/></svg></i> KROXY AI
            </button>
        </div>

        <div class="section-header-box">
            <div class="section-header-title" id="headerTitle">Steal An Egg Scriptlərimiz!</div>
            <div class="section-header-sub" id="headerSub">Bütün executorlar üçün yararlıdır scriptlərimiz!</div>
        </div>

        <div class="script-grid" id="scriptGrid"></div>

        <div class="ai-wrapper" id="aiWrapper">
            <div class="ai-chat-box" id="aiChatBox">
                <div class="ai-msg ai-msg-bot">⚡ KROXY AI Aktivdir! Mənə sual verə və ya kod köməyi istəyə bilərsiniz.</div>
            </div>

            <div class="ai-file-bar" id="aiFileBar">
                <span id="aiFileName">📁 fayl.txt</span>
                <button onclick="removeAiFile()"><i class="k-i"><svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></i> Ləğv et</button>
            </div>

        function copyScript(btn) {
            const card = btn.closest('.script-card');
            const codeText = card.querySelector('.code-text').innerText.trim();

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(codeText)
                    .then(() => setCopiedState(btn))
                    .catch(() => universalCopy(codeText, btn));
            } else {
                universalCopy(codeText, btn);
            }
        }

        function universalCopy(text, btn) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                setCopiedState(btn);
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function norm(s) {
            return (s || "").toLowerCase()
                .replace(/ə/g, "e").replace(/ı/g, "i").replace(/İ/g, "i").replace(/ö/g, "o")
                .replace(/ü/g, "u").replace(/ş/g, "s").replace(/ç/g, "c").replace(/ğ/g, "g");
        }

        function escHtml(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Mətni təhlükəsiz HTML-ə çevirir (kod bloku, **qalın**, `kod`, sətir keçidi)
        function formatAiText(text) {
            const parts = String(text).split(/```/);
            let html = "";
            parts.forEach((part, i) => {
                if (i % 2 === 1) {
                    const code = part.replace(/^[a-zA-Z0-9]*\n/, "");
                    html += `<pre class="ai-code"><code>${escHtml(code.trim())}</code></pre>`;
                } else {
                    let t = escHtml(part);
                    t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
                         .replace(/`([^`\n]+)`/g, '<code class="ai-inline">$1</code>')
                         .replace(/\n/g, "<br>");
                    html += t;
                }
            });
            return html;
        }

        function tryMath(text) {
            const m = text.replace(/,/g, ".").replace(/×/g, "*").replace(/÷/g, "/").replace(/\^/g, "**").match(/[\d(][\d\s+\-*/().%]*[\d)]/);
            if (!m) return null;
            const expr = m[0];
            if (!/[+\-*/%]/.test(expr)) return null;
            if (!/^[\d\s+\-*/().%]+$/.test(expr)) return null;
            try {
                const val = Function('"use strict"; return (' + expr + ")")();
                if (typeof val === "number" && isFinite(val)) return `🧮 ${expr.trim()} = **${Math.round(val * 1e10) / 1e10}**`;
            } catch (e) {}
            return null;
        }

        function detectLang(name, code) {

            if (map[ext]) return map[ext];
            if (/\blocal\b|\bthen\b|\bend\b|game:GetService/.test(code)) return "Luau/Lua";
            if (/\bdef \w+\(|import \w+|print\(/.test(code) && !/;\s*$/m.test(code)) return "Python";
            if (/const |let |=>|console\./.test(code)) return "JavaScript";
            return "naməlum";
        }

        function analyzeCode(name, code, question) {
            const lang = detectLang(name, code);
            const lines = code.split("\n").length;
            const out = [`📄 **${name}** faylı analiz olundu`, `• Dil: **${lang || "mətn"}**`, `• Sətir sayı: **${lines}**, simvol: **${code.length}**`];
            const fnRe = /(?:function\s+([\w.:]+)\s*\(|local\s+function\s+(\w+)|def\s+(\w+)\s*\(|(?:const|let)\s+(\w+)\s*=\s*(?:async\s*)?(?:\([^)]*\)|\w+)\s*=>)/g;
            const fns = []; let m;
            while ((m = fnRe.exec(code)) && fns.length < 15) fns.push(m[1] || m[2] || m[3] || m[4]);
            if (fns.length) out.push("• Funksiyalar: " + fns.map(f => "`" + f + "`").join(", "));
            const warns = [];
            if (/loadstring/.test(code)) warns.push("`loadstring` var: uzaq kod işlədilir, mənbəyə etibar et");
            if (/HttpGet|http[s]?:\/\//.test(code)) warns.push("Xarici link/HTTP sorğusu var");
            if (/while true do(?![\s\S]{0,200}wait)/.test(code)) warns.push("`while true do` içində `task.wait()` görünmür, oyun donması riski var");
            if (/\bwait\(/.test(code)) warns.push("`wait()` köhnədir, əvəzinə `task.wait()` işlət");
            if (/eval\(|innerHTML\s*=/.test(code)) warns.push("`eval`/`innerHTML` təhlükəsizlik riski yarada bilər");
            const open = (code.match(/[{(\[]/g) || []).length, close = (code.match(/[})\]]/g) || []).length;
            if (open !== close) warns.push(`Mötərizələr bərabər deyil (açılan ${open}, bağlanan ${close})`);
            if (/Luau/.test(lang)) {
                const blocks = (code.match(/\b(function|do|then)\b/g) || []).length;
                const ends = (code.match(/\bend\b/g) || []).length;
                if (blocks > ends + 2 || ends > blocks + 2) warns.push(`\`end\` sayı şübhəlidir (blok ${blocks}, end ${ends})`);
            }
            out.push(warns.length ? "\n⚠️ **Qeydlər:**\n" + warns.map(w => "• " + w).join("\n") : "\n✅ Açıq-aşkar problem tapılmadı.");
            if (question) out.push("\nSualın: \"" + question + "\". Kodun dərin izahı üçün onlayn AI bağlantısı lazımdır, hazırda əlçatan deyil.");
            return out.join("\n");
        }

        function offlineAnswer(text, attachment) {
            if (attachment && attachment.type === "file") return analyzeCode(attachment.name, attachment.content, text);
            if (attachment && attachment.type === "image") return "🖼️ Şəkli aldım, amma şəklin içindəkini oxumaq üçün görüntü modeli lazımdır və o, API-siz brauzerdə mümkün deyil. Şəkildəki kodu/mətni yazıb göndərsən kömək edərəm.";

            const n = norm(text).trim();
            const math = tryMath(text);
            if (math) return math;
            if (/saat|vaxt|tarix|bu gun|time|date/.test(n) && n.length < 40) {
                const d = new Date();
                return "🕒 İndi: **" + d.toLocaleString("az-AZ") + "**";
            }
            if (/script(ler)?|hub|siyahi/.test(n) && /(hansi|var|siyahi|goster|list|nelər|neler)/.test(n)) return scriptListAnswer();

            // Ən çox uyğunlaşan mövzunu seç
            let best = null, bestScore = 0;
            for (const item of KB) {
                let score = 0;
                for (const re of item.k) { const mm = n.match(re); if (mm) score += mm[0].length + 3; }
                if (score > bestScore) { best = item; bestScore = score; }
            }
            if (best) return best.a();

            return "Bu sualın dəqiq cavabı daxili bilik bazamda yoxdur. 🤔\n\nBelə suallara cavab verə bilirəm: Luau/Roblox (dəyişən, funksiya, dövr, table, RemoteEvent, DataStore, Tween, GUI), JS/Python əsasları, xəta izahı, riyazi hesab və fayl analizi.\n\nSualı bir az başqa cür yazıb yenidən cəhd et. Onlayn AI bağlantısı qurulanda hər mövzuda cavab verəcəm.";
        }


        const SYS_PROMPT = `Sən KROXY AI-san: güclü proqramlaşdırma köməkçisi və düşüncəli məsləhətçi.
Qaydalar:
- İstifadəçi hansı dildə yazırsa həmin dildə cavab ver (əsasən Azərbaycan dilində, səlis və təbii).
- Cavab verməzdən əvvəl məsələni diqqətlə düşün: tələbi başa düş, addım-addım əsaslandır, sonra nəticəni ver. Səhv və ya yarımçıq cavab vermə.
- Kodlama üzrə mütəxəssissən: Luau/Roblox Studio, JavaScript, Python, HTML/CSS, C++ və s. Kodu həmişə tam, işlək və markdown kod bloku (üç əks dırnaq ilə) daxilində ver, qısa izah əlavə et.
- Xətaları tap, səbəbini izah et və düzəlişi göstər. Alternativ yolları müqayisə et.
- Bilmədiyin şeyi uydurma, açıq de. Sual qeyri-dəqiqdirsə, ən yaxşı fərziyyə ilə cavab ver və nəyi fərz etdiyini qeyd et.
- Faydalı, dərin və düşüncəli ol, lakin lazımsız uzatma.`;
        const aiHistory = [];

        function withTimeout(promise, ms) {
            return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
        }

        let puterLoading = null;
        function loadPuter() {
            if (window.puter) return Promise.resolve();
            if (puterLoading) return puterLoading;
            puterLoading = new Promise((resolve, reject) => {
                const sc = document.createElement("script");
                sc.src = "https://js.puter.com/v2/";
                sc.onload = resolve;
                sc.onerror = () => { puterLoading = null; reject(new Error("js.puter.com skripti yüklənmədi (bloklanıb və ya əlçatmazdır)")); };
                document.head.appendChild(sc);
            });
            return puterLoading;
        }

        loadPuter().catch(() => {});

        function extractText(r) {
            if (typeof r === "string") return r;
            if (r && r.message && r.message.content !== undefined) {
                const c = r.message.content;
                return Array.isArray(c) ? c.map(x => x.text || "").join("") : String(c);
            }
            if (r && r.choices && r.choices[0] && r.choices[0].message) return r.choices[0].message.content;
            if (r && typeof r.toString === "function" && r.toString() !== "[object Object]") return r.toString();
            return "";
        }

        async function onlineAnswer(messages) {
            try {
                await withTimeout(loadPuter(), 25000);
            } catch (e) {
                console.warn("Puter yüklənmədi. Səbəb:", e && e.message ? e.message : e, "| səhifə:", location.href);
                return null;
            }
            // Llama 4 birinci; əlçatmazdırsa növbəti model sınanır
            const MODELS = [
                "meta-llama/llama-4-maverick",
                "meta-llama/llama-4-scout",
                "deepseek/deepseek-v4-pro",
                "openai/gpt-5.5",
                undefined
            ];
            for (const mdl of MODELS) {
                try {
                    const opts = mdl ? { model: mdl, stream: true } : { stream: true };
                    const r = await withTimeout(puter.ai.chat(messages, opts), 60000);
                    let acc = "";
                    if (r && typeof r[Symbol.asyncIterator] === "function") {
                        let last = 0;
                        for await (const part of r) {
                            const d = part && (part.text || (part.message && part.message.content) || "");
                            if (!d) continue;
                            acc += d;
                            const now = Date.now();
                            if (now - last > 120) {
                                last = now;
                                const el = getLive();
                                if (el) {
                                    el.innerHTML = formatAiText(acc);
                                    const box = document.getElementById("aiChatBox");
                                    if (box) box.scrollTop = box.scrollHeight;
                                }
                            }
                        }
                    } else {
                        acc = extractText(r);
                    }
                    if (acc && acc.trim()) { console.log("AI modeli:", mdl || "default"); return acc; }
                } catch (e) {
                    const msg = (e && (e.message || e.error || e.code)) || e;
                    console.log("Puter model xətası (" + (mdl || "default") + "):", msg);
                    // İstifadəçi giriş pəncərəsini bağladısa, təkrar-təkrar sınama
                    if (/cancel|denied|auth|sign|login/i.test(String(msg) + String(e && e.code))) break;
                }
            }
            return null;
        }

        function getLive() {
            const el = document.querySelector(".ai-msg-thinking");
            if (el) {
                document.querySelectorAll("[data-live]").forEach(n => n.removeAttribute("data-live"));
                el.classList.remove("ai-msg-thinking");
                el.setAttribute("data-live", "1");
                return el;
            }
            return document.querySelector('[data-live="1"]');
        }
        async function generateRealAiResponse(promptText, attachment) {
            const low = promptText.toLowerCase();
            if (low.startsWith("/imagine") || low.includes("şəkil yarat")) {
                let clean = promptText.replace(/şəkil yarat/gi, "").replace(/\/imagine/gi, "").trim() || "cyberpunk neon robot";
                const img = `https://image.pollinations.ai/prompt/${encodeURIComponent(clean)}?width=800&height=500&nologo=true`;
                return `🎨 <b>Yaradılan Şəkil: "${escHtml(clean)}"</b><br><img class="ai-gen-img" src="${img}" onerror="this.outerHTML='⚠️ Şəkil xidməti hazırda cavab vermir.'">`;
            }

            let fullPrompt = promptText || "Bu faylı izah et.";
            if (attachment) {
                if (attachment.type === "file") fullPrompt += `\n\n[Fayl Məzmunu - ${attachment.name}]:\n${attachment.content.slice(0, 20000)}`;
                else if (attachment.type === "image") fullPrompt += `\n\n[İstifadəçi Şəkil Əlavə Etdi: ${attachment.name}]`;
            }

            aiHistory.push({ role: "user", content: fullPrompt });
            const messages = [{ role: "system", content: SYS_PROMPT }, ...aiHistory.slice(-12)];
            const online = await onlineAnswer(messages);
            if (online) {
                aiHistory.push({ role: "assistant", content: online });
                return formatAiText(online);
            }
            aiHistory.pop();
            return formatAiText(offlineAnswer(promptText, attachment)) + '<br><br><span style="opacity:.6;font-size:.75rem">⚠️ Llama 4 ilə əlaqə qurulmadı, daxili rejimdə cavab verildi. Saytı github.io ünvanından aç və Puter icazəsini ver.</span>';
        }

        function handleAiKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendAiMessage();
            }
        }

        async function sendAiMessage() {
            const inputEl = document.getElementById('aiInput');
            const query = inputEl.value.trim();

            if (!query && !attachedAiFile) return;

            const chatBox = document.getElementById('aiChatBox');

            const userDiv = document.createElement('div');
            userDiv.className = 'ai-msg ai-msg-user';
            
            let displayMsg = query;
            if (attachedAiFile) {
                displayMsg += `\n[${attachedAiFile.type === 'image' ? '🖼️ Şəkil' : '📄 Fayl'}: ${attachedAiFile.name}]`;
            }
            userDiv.textContent = displayMsg;
            chatBox.appendChild(userDiv);

            inputEl.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const botDiv = document.createElement('div');
            botDiv.className = 'ai-msg ai-msg-bot ai-msg-thinking';
            botDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            const currentAttachment = attachedAiFile;
            removeAiFile();

            const response = await generateRealAiResponse(query, currentAttachment);
            botDiv.classList.remove('ai-msg-thinking');
            botDiv.innerHTML = response;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        renderScripts(stealScripts);
    </script>
</body>
