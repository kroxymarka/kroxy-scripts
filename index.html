<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KROXY SCRIPTS | Steal An Egg Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        :root {
            --bg-dark: #030008;
            --card-bg: rgba(18, 10, 36, 0.75);
            --primary-neon: #a855f7;
            --secondary-neon: #06b6d4;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glow: rgba(168, 85, 247, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(8, 3, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Notice Banner */
        .notice-banner {
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.15), rgba(6, 182, 212, 0.15));
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .notice-banner i {
            color: var(--secondary-neon);
            font-size: 1.3rem;
        }

        .notice-text h4 {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 700;
        }

        .notice-text p {
            font-size: 0.78rem;
            color: var(--text-sub);
        }

        /* Controls Section */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(15, 8, 30, 0.9);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .search-box input:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-neon);
            font-size: 1.1rem;
        }

        /* Quick Badges Filter */
        .quick-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .quick-filters::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-chip.active {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        /* Stats Header */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .panel-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .count-badge {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid var(--primary-neon);
            color: #d8b4fe;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Grid & Cards */
        .script-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
            gap: 16px;
        }

        .script-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .script-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(180deg, var(--primary-neon), var(--secondary-neon));
        }

        .script-card:active {
            transform: scale(0.98);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .script-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-name i {
            color: var(--secondary-neon);
        }

        .verified-tag {
            font-size: 0.7rem;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        /* Code View Container */
        .code-box {
            background: rgba(5, 2, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px;
            position: relative;
        }

        .code-text {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #c084fc;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        /* Action Copy Button */
        .btn-copy {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-neon), #7e22ce);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .btn-copy:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        .btn-copy.copied {
            background: linear-gradient(135deg, #16a34a, #22c55e) !important;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4) !important;
        }

        /* Bottom Mobile Navigation */
        .mobile-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(8, 3, 18, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 0.7rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            width: 33%;
            text-align: center;
        }

        .nav-item i {
            font-size: 1.2rem;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--secondary-neon);
        }

        .nav-item.active i {
            transform: translateY(-2px);
            color: var(--secondary-neon);
            text-shadow: 0 0 10px var(--secondary-neon);
        }

        /* Toast Alert Popup */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(22, 163, 74, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> Skript müvəqqəti yaddaşa kopyalandı!
    </div>

    <!-- Top Navigation -->
    <div class="navbar">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-egg"></i></div>
            <div class="logo-text">KROXY HUB</div>
        </div>
        <div style="font-size: 0.75rem; color: var(--text-sub); background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
            v3.6 Mobile
        </div>
    </div>

    <div class="container">
        
        <!-- Notice Banner -->
        <div class="notice-banner">
            <i class="fa-solid fa-shield-halved"></i>
            <div class="notice-text">
                <h4>Steal An Egg - Ən Yaxşı Skriptlər</h4>
                <p>Bütün skriptlər mobil executorlar (Delta, Fluxus, Codex) üçün tam optimallaşdırılıb.</p>
            </div>
        </div>

        <!-- Controls Section -->
        <div class="controls-section" id="searchSection">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Skript adı ilə axtar..." onkeyup="filterScripts()">
            </div>

            <!-- Quick Category Chips -->
            <div class="quick-filters">
                <div class="filter-chip active" onclick="setFilter('all', this)">Hamısı</div>
                <div class="filter-chip" onclick="setFilter('popular', this)">Populyar</div>
                <div class="filter-chip" onclick="setFilter('keyless', this)">Key-siz</div>
            </div>
        </div>

        <!-- Panel Header -->
        <div class="panel-header">
            <h2><i class="fa-solid fa-bolt" style="color: var(--primary-neon);"></i> Mövcud Skriptlər</h2>
            <span class="count-badge" id="scriptCount">10 Hub</span>
        </div>

        <!-- Script Cards Grid -->
        <div class="script-grid" id="scriptGrid"></div>

    </div>

    <!-- Mobile Navigation Bar -->
    <div class="mobile-nav">
        <div class="nav-item active" onclick="scrollToTop()">
            <i class="fa-solid fa-house"></i>
            <span>Ana Səhifə</span>
        </div>
        <div class="nav-item" onclick="focusSearch()">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Axtarış</span>
        </div>
        <div class="nav-item" onclick="scrollToGrid()">
            <i class="fa-solid fa-code"></i>
            <span>Skriptlər</span>
        </div>
    </div>

    <script>
        const scriptsData = [
            { name: "Chilli Hub", type: "popular", code: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/tienkhanh1/spicy/main/Chilli.lua\"))()" },
            { name: "Tsuo Hub", type: "keyless", code: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/Tsuo7/TsuoHub/main/stealanegg\"))()" },
            { name: "Axon Hub", type: "popular", code: "loadstring(game:HttpGet(\"https://api.luarmor.net/files/v3/loaders/97c3f6db55a2cf72141537a85458e5a7.lua\"))()" },
            { name: "Foxname Hub", type: "keyless", code: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/caomod2077/Script/refs/heads/main/Fn-stealanegg.lua\"))()" },
            { name: "Rift Hub", type: "popular", code: "loadstring(game:HttpGet(\"https://rifton.top/loader.lua\"))()" },
            { name: "OMG Hub", type: "keyless", code: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/Omgshit/Scripts/main/MainLoader.lua\"))()" },
            { name: "Clover Hub", type: "popular", code: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/Ryuun0x/Clover/main/main.lua\"))()" },
            { name: "Ajjans Hub", type: "keyless", code: "loadstring(game:HttpGet(\"https://api.luarmor.net/files/v4/loaders/359e97f8618e9008afe5f496184ebb7c.lua\"))()" },
            { name: "Solix Hub", type: "popular", code: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/porqueijjmzm1/cool/main/StealAEgg\"))()" },
            { name: "Pig Hub", type: "keyless", code: "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/mopsscript7-gif/steal-an-egg/refs/heads/main/script.lua\"))()" }
        ];

        const grid = document.getElementById('scriptGrid');
        let currentFilter = 'all';

        function renderScripts(data) {
            grid.innerHTML = '';
            document.getElementById('scriptCount').innerText = `${data.length} Hub`;

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'script-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="script-name">
                            <i class="fa-solid fa-terminal"></i> ${item.name}
                        </div>
                        <span class="verified-tag"><i class="fa-solid fa-check"></i> İşləkdir</span>
                    </div>
                    <div class="code-box">
                        <div class="code-text">${item.code}</div>
                    </div>
                    <button class="btn-copy" onclick="copyScript('${item.code.replace(/'/g, "\\'")}', this)">
                        <i class="fa-regular fa-copy"></i> Skripti Kopyala
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function copyScript(codeText, btn) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(codeText).then(() => handleCopySuccess(btn));
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = codeText;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    handleCopySuccess(btn);
                } catch (err) {
                    console.error('Kopyalama xətası:', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function handleCopySuccess(btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Kopyalandı!`;
            btn.classList.add('copied');
            
            showToast();

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('copied');
            }, 2000);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function filterScripts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = scriptsData.filter(s => {
                const matchesSearch = s.name.toLowerCase().includes(query);
                const matchesFilter = currentFilter === 'all' || s.type === currentFilter;
                return matchesSearch && matchesFilter;
            });
            renderScripts(filtered);
        }

        function setFilter(filterType, element) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            currentFilter = filterType;
            filterScripts();
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function focusSearch() {
            document.getElementById('searchInput').focus();
            document.getElementById('searchSection').scrollIntoView({ behavior: 'smooth' });
        }

        function scrollToGrid() {
            document.getElementById('scriptGrid').scrollIntoView({ behavior: 'smooth' });
        }

        // İlkin render
        renderScripts(scriptsData);
    </script>
</body>
</html>
